<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>
// --- Proteção por link secreto ---
const CHAVE_SECRETA = "leandro-adm-30f3k71"; // <- troque aqui
const params = new URLSearchParams(window.location.search);
const chaveFornecida = params.get("chave");

if (chaveFornecida !== CHAVE_SECRETA) {
  document.write("<h1>404 - Página não encontrada</h1>");
  throw new Error("Acesso negado");
}
// --- Fim da proteção ---
</script>
<meta charset="UTF-8">
<title>Painel Administrativo</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .admin-container { max-width: 600px; margin: 40px auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .admin-container h2 { margin-bottom: 20px; }
  .admin-container label { display: block; margin-top: 12px; font-size: 13px; font-weight: 600; color: #333; }
  .admin-container input[type="text"],
  .admin-container input[type="url"],
  .admin-container input[type="number"],
  .admin-container textarea {
    width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;
  }
  .admin-container .checkbox-linha { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .admin-container .checkbox-linha input { width: auto; }
  .admin-container button { margin-top: 20px; padding: 10px 20px; background: #2979ff; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
  .admin-container button:hover { background: #1e5fd9; }
  .lista-cadastrados { max-width: 600px; margin: 20px auto; }
  .lista-cadastrados .item { background: #fff; padding: 10px 15px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; gap: 10px; }
  .lista-cadastrados .item .acoes { display: flex; gap: 6px; }
  .lista-cadastrados button.btn-editar { background: #ffa000; padding: 5px 10px; font-size: 12px; margin: 0; }
  .lista-cadastrados button.btn-excluir { background: #e53935; padding: 5px 10px; font-size: 12px; margin: 0; }
</style>
</head>
<body>

<div class="admin-container">
  <h2 id="titulo-form">Cadastrar Produto</h2>

  <input type="hidden" id="editandoId" value="">

  <label>Nome do Produto</label>
  <input type="text" id="nome" placeholder="Ex: Kit Limpeza Principia">

  <label>Descrição</label>
  <textarea id="descricao" rows="2" placeholder="Ex: Todo tipo de pele Dia/noite"></textarea>

  <label>Imagem (URL)</label>
  <input type="text" id="imagem" placeholder="img/produto.jpg">

  <label>Categoria</label>
  <input type="text" id="categoria" placeholder="Ex: beleza, eletronicos, casa">

  <label>Preço Original (riscado) — opcional</label>
  <input type="text" id="precoDe" placeholder="Ex: R$ 110,25">

  <label>Preço com Pix (aparece em destaque)</label>
  <input type="text" id="precoPor" placeholder="Ex: R$ 76,07">

  <label>Desconto no Pix (%) — opcional</label>
  <input type="number" id="descontoPix" placeholder="Ex: 31">

  <label>Preço em outros meios (sem Pix)</label>
  <input type="text" id="outrosMeios" placeholder="Ex: 82,68">

  <div class="checkbox-linha">
    <input type="checkbox" id="pixAtivo">
    <label style="margin:0;">Desconto exclusivo no Pix</label>
  </div>

  <div class="checkbox-linha">
    <input type="checkbox" id="freteGratis">
    <label style="margin:0;">Frete grátis</label>
  </div>

  <label>Selo (opcional)</label>
  <input type="text" id="selo" placeholder="Ex: MAIS VENDIDO">

  <label>Link de Afiliado</label>
  <input type="url" id="linkAfiliado" placeholder="https://...">

  <button onclick="salvarProduto()" id="btnSalvar">Salvar Produto</button>
</div>

<div class="lista-cadastrados" id="lista-cadastrados"></div>

<script>
function getProdutos() {
  return JSON.parse(localStorage.getItem("produtosCadastrados")) || [];
}

function limparFormulario() {
  document.getElementById("editandoId").value = "";
  document.getElementById("titulo-form").textContent = "Cadastrar Produto";
  document.getElementById("btnSalvar").textContent = "Salvar Produto";
  document.querySelectorAll(".admin-container input, .admin-container textarea").forEach(el => {
    if (el.type === "checkbox") el.checked = false;
    else if (el.id !== "editandoId") el.value = "";
  });
}

function salvarProduto() {
  const produtos = getProdutos();
  const editandoId = document.getElementById("editandoId").value;

  const dados = {
    nome: document.getElementById("nome").value,
    descricao: document.getElementById("descricao").value,
    imagem: document.getElementById("imagem").value,
    categoria: document.getElementById("categoria").value.trim().toLowerCase(),
    precoDe: document.getElementById("precoDe").value,
    precoPor: document.getElementById("precoPor").value,
    descontoPix: document.getElementById("descontoPix").value,
    pixAtivo: document.getElementById("pixAtivo").checked,
    outrosMeios: document.getElementById("outrosMeios").value,
    freteGratis: document.getElementById("freteGratis").checked,
    selo: document.getElementById("selo").value,
    linkAfiliado: document.getElementById("linkAfiliado").value
  };

  if (!dados.nome || !dados.precoPor || !dados.linkAfiliado) {
    alert("Preencha ao menos Nome, Preço com Pix e Link de Afiliado.");
    return;
  }

  if (editandoId) {
    const index = produtos.findIndex(p => p.id === Number(editandoId));
    if (index !== -1) {
      produtos[index] = { ...produtos[index], ...dados };
    }
    alert("Produto atualizado com sucesso!");
  } else {
    produtos.push({ id: Date.now(), ...dados });
    alert("Produto cadastrado com sucesso!");
  }

  localStorage.setItem("produtosCadastrados", JSON.stringify(produtos));
  limparFormulario();
  renderizarLista();
}

function editarProduto(id) {
  const produtos = getProdutos();
  const p = produtos.find(prod => prod.id === id);
  if (!p) return;

  document.getElementById("editandoId").value = p.id;
  document.getElementById("nome").value = p.nome || "";
  document.getElementById("descricao").value = p.descricao || "";
  document.getElementById("imagem").value = p.imagem || "";
  document.getElementById("categoria").value = p.categoria || "";
  document.getElementById("precoDe").value = p.precoDe || "";
  document.getElementById("precoPor").value = p.precoPor || "";
  document.getElementById("descontoPix").value = p.descontoPix || "";
  document.getElementById("pixAtivo").checked = !!p.pixAtivo;
  document.getElementById("outrosMeios").value = p.outrosMeios || "";
  document.getElementById("freteGratis").checked = !!p.freteGratis;
  document.getElementById("selo").value = p.selo || "";
  document.getElementById("linkAfiliado").value = p.linkAfiliado || "";

  document.getElementById("titulo-form").textContent = "Editar Produto";
  document.getElementById("btnSalvar").textContent = "Atualizar Produto";

  window.scrollTo({ top: 0, behavior: "smooth" });
}

function excluirProduto(id) {
  let produtos = getProdutos();
  produtos = produtos.filter(p => p.id !== id);
  localStorage.setItem("produtosCadastrados", JSON.stringify(produtos));
  renderizarLista();
}

function renderizarLista() {
  const produtos = getProdutos();
  const container = document.getElementById("lista-cadastrados");
  container.innerHTML = produtos.map(p => `
    <div class="item">
      <span>${p.nome} (${p.categoria || "sem categoria"})</span>
      <div class="acoes">
        <button class="btn-editar" onclick="editarProduto(${p.id})">Editar</button>
        <button class="btn-excluir" onclick="excluirProduto(${p.id})">Excluir</button>
      </div>
    </div>
  `).join("");
}

renderizarLista();
</script>

</body>
</html>
